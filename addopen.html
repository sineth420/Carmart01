<style>
  :root {
    --primary: #f97316; /* Orange */
    --primary-dark: #ea580c;
    --white: #ffffff;
    --dark-bg: #0f172a;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html { scroll-behavior: smooth; }
  
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #f8fafc; /* Clean white/slate background */
    color: var(--dark-bg);
    margin: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Dark Glassmorphism Box Style */
  .glass-card {
    background: rgba(15, 23, 42, 0.75); /* Dark slate glass tint */
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.15);
    color: var(--white);
  }

  /* Navbar Specific Glass */
  .nav-glass {
    border-radius: 0;
    border-left: 0;
    border-right: 0;
    border-top: 0;
  }

  /* Buttons */
  .btn-primary, .btn-outline {
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    width: 100%;
    border: none;
    font-size: 0.95rem;
  }
  .btn-primary {
    background-color: var(--primary);
    color: var(--white);
    box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.3);
  }
  .btn-primary:hover { background-color: var(--primary-dark); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  
  .btn-outline {
    background-color: transparent;
    color: var(--white);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .btn-outline:hover { background-color: rgba(255, 255, 255, 0.1); border-color: var(--primary); }

  /* Burger Menu */
  .burger { width: 28px; height: 20px; position: relative; cursor: pointer; background: transparent; border: none; padding: 0; }
  .burger span { display: block; position: absolute; height: 3px; width: 100%; background: var(--white); border-radius: 2px; transition: all 0.3s ease; }
  .burger span:nth-child(1) { top: 0; }
  .burger span:nth-child(2) { top: 8px; }
  .burger span:nth-child(3) { top: 16px; }
  .burger.open span:nth-child(1) { top: 8px; transform: rotate(45deg); background: var(--primary); }
  .burger.open span:nth-child(2) { opacity: 0; }
  .burger.open span:nth-child(3) { top: 8px; transform: rotate(-45deg); background: var(--primary); }

  /* Side Panel */
  .side-panel {
    position: fixed; top: 0; right: 0; height: 100vh; width: 320px; max-width: 85vw;
    background: var(--white); box-shadow: -10px 0 30px rgba(0,0,0,0.1);
    transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100; padding: 24px; overflow-y: auto; padding-top: max(24px, env(safe-area-inset-top));
  }
  .side-panel.open { transform: translateX(0); }
  .panel-overlay {
    position: fixed; inset: 0; background: rgba(17, 24, 39, 0.4);
    opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 99;
  }
  .panel-overlay.open { opacity: 1; pointer-events: all; }

  /* Gallery Styles */
  .main-media {
    width: 100%; aspect-ratio: 16/9; background: var(--dark-bg); border-radius: 12px;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .main-media img, .main-media video {
    width: 100%; height: 100%; object-fit: cover;
  }
  .thumbnail {
    width: 100%; aspect-ratio: 1/1; background: #e2e8f0; border-radius: 8px;
    overflow: hidden; cursor: pointer; border: 2px solid transparent;
    transition: all 0.2s;
  }
  .thumbnail.active { border-color: var(--primary); }
  .thumbnail:hover { border-color: var(--primary-dark); }
  .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
  .thumbnail.video-thumb { background: var(--dark-bg); display: flex; align-items: center; justify-content: center; color: white; flex-direction: column; gap: 4px; }
  
  .spec-item {
    display: flex; flex-direction: column; gap: 4px;
    padding: 14px; background: rgba(255, 255, 255, 0.05); border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: transform 0.2s;
  }
  .spec-item:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.08); }
  .spec-icon { color: var(--primary); font-size: 18px; margin-bottom: 4px; }

  /* Skeleton Loader */
  .skeleton {
    background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
    background-size: 200% 100%; animation: shimmer 1.5s infinite;
  }
  .glass-card .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.05) 75%);
    background-size: 200% 100%; animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Toast */
  .toast {
    position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--dark-bg); color: var(--white);
    padding: 12px 24px; border-radius: 8px; z-index: 300;
    font-weight: 500; transition: transform 0.3s ease;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    width: max-content; max-width: 90vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Accessibility Focus States */
  button:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
    border-radius: 4px;
  }
</style>
</head>

<script>
  // ===== FIREBASE REALTIME DATABASE CONFIGURATION =====
  const firebaseConfig = {
    apiKey: "AIzaSyAEu-uW53mk9kaHh6Lh_qa8-M59yz_fseY",
    authDomain: "car-mart01.firebaseapp.com",
    databaseURL: "https://car-mart01-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "car-mart01",
    storageBucket: "car-mart01.firebasestorage.app",
    messagingSenderId: "257242312778",
    appId: "1:257242312778:web:5c3e8bff7429a5f5d2b6b3",
    measurementId: "G-MFT2YY8Y5Y"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  let currentAdData = {}; // To store ad data for cart

  // ===== UI INTERACTIONS =====
  function toggleBurger() {
    const burger = document.getElementById('burger');
    const panel = document.getElementById('sidePanel');
    const overlay = document.getElementById('panelOverlay');
    const isOpen = burger.classList.contains('open');
    
    burger.classList.toggle('open', !isOpen);
    panel.classList.toggle('open', !isOpen);
    overlay.classList.toggle('open', !isOpen);
    burger.setAttribute('aria-expanded', !isOpen);
    document.body.style.overflow = !isOpen ? 'hidden' : '';
  }

  function closeBurger() {
    const burger = document.getElementById('burger');
    if (!burger.classList.contains('open')) return;
    
    burger.classList.remove('open');
    document.getElementById('sidePanel').classList.remove('open');
    document.getElementById('panelOverlay').classList.remove('open');
    burger.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ===== MEDIA GALLERY LOGIC =====
  function changeMedia(type, src, element) {
    const mainMedia = document.getElementById('mainMedia');
    
    document.querySelectorAll('.thumbnail').forEach(t => {
      t.classList.remove('active');
      t.setAttribute('aria-current', 'false');
    });
    
    element.classList.add('active');
    element.setAttribute('aria-current', 'true');

    if (type === 'img') {
      mainMedia.innerHTML = `<img src="${src}" alt="Vehicle enlarged view">`;
    } else if (type === 'video') {
      mainMedia.innerHTML = `
        <video controls autoplay playsinline style="width:100%; height:100%; object-fit:cover;">
          <source src="${src}" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      `;
    }
  }

  // ===== ADD TO CART LOGIC =====
  async function addToCart() {
    const user = auth.currentUser;
    // FIX: If user is not logged in, prevent adding to cart and redirect to login
    if (!user) {
      showToast("Please sign in to add items to cart. Redirecting...");
      setTimeout(() => {
        window.location.href = 'index.html'; // Redirect to homepage to login
      }, 2000);
      return;
    }
    
    try {
      const cartRef = db.ref(`Mycart/${user.uid}`);
      const snapshot = await cartRef.once('value');
      const itemCount = snapshot.numChildren();
      const newItemKey = `item${itemCount + 1}`; // Creates item1, item2, item3...

      await cartRef.child(newItemKey).set({
        type: currentAdData.type,
        id: currentAdData.id,
        title: currentAdData.title,
        price: currentAdData.price,
        imageUrl: currentAdData.imageUrl || ""
      });
      showToast("Added to Cart successfully!");
    } catch (error) {
      showToast("Error adding to cart: " + error.message);
    }
  }

  // ===== TRACK LOGIN STATE & CART COUNT =====
  auth.onAuthStateChanged(user => {
    const cartCount = document.getElementById('cartCount');
    if (user) {
      db.ref(`Mycart/${user.uid}`).on('value', (snapshot) => {
        const count = snapshot.numChildren();
        if (count > 0) {
          cartCount.innerText = count;
          cartCount.classList.remove('hidden');
        } else {
          cartCount.classList.add('hidden');
        }
      });
    } else {
      cartCount.classList.add('hidden');
    }
  });

  // ===== DATA FETCHING LOGIC =====
  async function loadAdDetails() {
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');
    const id = urlParams.get('id');

    const loadingState = document.getElementById('loadingState');
    const adContent = document.getElementById('adContent');

    if (!type || !id) {
      loadingState.innerHTML = '<div class="col-span-full text-center py-20 text-red-500">Error: No Ad ID found in URL.</div>';
      return;
    }

    try {
      const adRef = db.ref(`vehicles/${type}/${id}`);
      const snapshot = await adRef.once('value');
      const adData = snapshot.val();

      loadingState.classList.add('hidden');
      adContent.classList.remove('hidden');

      if (adData) {
        currentAdData = { type, id, ...adData };

        document.getElementById('adTitle').innerText = adData.title || 'Untitled Vehicle';
        document.getElementById('adPrice').innerText = `Rs ${Number(adData.price || 0).toLocaleString()}`;
        document.getElementById('adLocation').innerHTML = `<i class="fa-solid fa-location-dot" aria-hidden="true"></i> ${adData.location || 'Sri Lanka'}`;
        document.getElementById('adDescription').innerText = adData.description || 'No description provided.';
        document.getElementById('adYear').innerText = adData.year || 'N/A';
        document.getElementById('adMileage').innerText = `${Number(adData.mileage || 0).toLocaleString()} km`;
        document.getElementById('adFuel').innerText = adData.fuelType || 'N/A';
        document.getElementById('adCc').innerText = `${adData.cc || 'N/A'} cc`;
        document.getElementById('adCondition').innerText = adData.condition || 'N/A';
        document.getElementById('adType').innerText = adData.vehicleType || type;
        
        if (adData.createdAt) {
          document.getElementById('adTime').innerText = getTimeAgo(adData.createdAt);
        }

        // ===== POPULATE SELLER INFO & BUTTONS =====
        const sellerName = adData.sellerName || "Unknown Seller";
        const mobile = adData.mobileNumber || "";
        const whatsapp = adData.whatsappNumber || mobile;

        document.getElementById('sellerName').innerText = sellerName;
        document.getElementById('sellerPhone').innerText = mobile ? mobile : "No phone provided";
        
        const initial = sellerName.charAt(0).toUpperCase();
        document.getElementById('sellerInitial').innerText = initial;

        const callBtn = document.getElementById('callBtn');
        if (mobile) {
          callBtn.addEventListener('click', () => {
            window.location.href = `tel:${mobile}`;
          });
        } else {
          callBtn.addEventListener('click', () => {
            showToast("Phone number not available");
          });
        }

        const whatsappBtn = document.getElementById('whatsappBtn');
        if (whatsapp) {
          let waNum = whatsapp.replace(/\D/g, '');
          if (waNum.startsWith('0')) {
            waNum = '94' + waNum.substring(1);
          }
          whatsappBtn.addEventListener('click', () => {
            window.open(`https://wa.me/${waNum}`, '_blank');
          });
        } else {
          whatsappBtn.addEventListener('click', () => {
            showToast("WhatsApp number not available");
          });
        }

        document.getElementById('cartBtn').addEventListener('click', addToCart);

      } else {
        adContent.innerHTML = '<div class="col-span-full text-center py-20 text-slate-500">Ad not found. It may have been deleted.</div>';
      }

    } catch (error) {
      console.error("Error fetching ad:", error);
      loadingState.innerHTML = `<div class="col-span-full text-center py-20 text-red-500">Error loading ad. ${error.message}</div>`;
    }
  }

  function getTimeAgo(timestamp) {
    const ts = typeof timestamp === 'number' ? timestamp : 0;
    if(ts === 0) return "Recently";
    
    const seconds = Math.floor((Date.now() - ts) / 1000);
    if (seconds < 60) return "Just now";
    if (seconds < 3600) return `${Math.floor(seconds/60)} mins ago`;
    if (seconds < 86400) return `${Math.floor(seconds/3600)} hours ago`;
    if (seconds < 604800) return `${Math.floor(seconds/86400)} days ago`;
    return new Date(ts).toLocaleDateString();
  }

  document.addEventListener('DOMContentLoaded', loadAdDetails);
</script>
